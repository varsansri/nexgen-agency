<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Manager — NexGen Digital</title>
  <link href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" rel="stylesheet" />
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    [class*="ToolbarSectionHeaderButton-button"] { display: none !important; }
  </style>
</head>
<body>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "git-gateway",
          branch: "main",
        },
        media_folder: "public/images",
        public_folder: "/images",
        site_url: "https://nexgendigital.com",
        display_url: "https://nexgendigital.com",
        publish_mode: "editorial_workflow",
        collections: [
          {
            name: "settings",
            label: "⚙️ Site Settings",
            delete: false,
            editor: { preview: false },
            files: [
              {
                file: "src/config/config.json",
                label: "General",
                name: "config",
                fields: [
                  { label: "Site Title", name: "title", widget: "string", required: false },
                  { label: "Logo Text", name: "logo_text", widget: "string", required: false },
                  { label: "Footer Text", name: "footer_content", widget: "text", required: false },
                  { label: "Copyright", name: "copyright", widget: "string", required: false },
                  { label: "Contact Form Action URL", name: "contact_form_action", widget: "string", required: false },
                  { label: "Meta Description", name: "meta_description", widget: "text", required: false },
                  { label: "Meta Author", name: "meta_author", widget: "string", required: false },
                ]
              },
              {
                file: "src/config/menu.json",
                label: "Navigation",
                name: "menu",
                fields: [
                  { label: "Main Navigation", name: "main", widget: "list", fields: [
                    { label: "Name", name: "name", widget: "string" },
                    { label: "URL", name: "url", widget: "string" },
                  ]},
                  { label: "Footer Menus", name: "footer", widget: "list", fields: [
                    { label: "Column Name", name: "name", widget: "string" },
                    { label: "Links", name: "menu", widget: "list", fields: [
                      { label: "Label", name: "text", widget: "string" },
                      { label: "URL", name: "url", widget: "string" },
                    ]},
                  ]},
                ]
              },
              {
                file: "src/config/theme.json",
                label: "Theme",
                name: "theme",
                fields: [
                  { label: "Primary Color", name: "primary", widget: "string" },
                  { label: "Body Background", name: "body", widget: "string" },
                  { label: "Text Color", name: "text", widget: "string" },
                  { label: "Font Family", name: "primary", widget: "string" },
                ]
              },
              {
                file: "src/config/social.json",
                label: "Social Media",
                name: "social",
                fields: [
                  { label: "Facebook", name: "facebook", widget: "string", required: false },
                  { label: "Twitter", name: "twitter", widget: "string", required: false },
                  { label: "Instagram", name: "instagram", widget: "string", required: false },
                  { label: "LinkedIn", name: "linkedin", widget: "string", required: false },
                  { label: "Dribbble", name: "dribbble", widget: "string", required: false },
                  { label: "Behance", name: "behance", widget: "string", required: false },
                  { label: "YouTube", name: "youtube", widget: "string", required: false },
                  { label: "Email", name: "email", widget: "string", required: false },
                  { label: "Phone", name: "phone", widget: "string", required: false },
                  { label: "Address", name: "address", widget: "string", required: false },
                ]
              },
            ]
          },
          {
            name: "homepage",
            label: "🏠 Homepage",
            editor: { preview: false },
            files: [
              {
                file: "src/content/_index.md",
                label: "Homepage Content",
                name: "index",
                fields: [
                  { label: "Banner Title", name: "banner_title", widget: "string" },
                  { label: "Banner Text", name: "banner_content", widget: "text" },
                  { label: "Banner Button Label", name: "banner_button_label", widget: "string" },
                  { label: "Banner Button Link", name: "banner_button_link", widget: "string" },
                  { label: "CTA Title", name: "cta_title", widget: "string" },
                  { label: "CTA Text", name: "cta_content", widget: "text" },
                  { label: "CTA Button Label", name: "cta_button_label", widget: "string" },
                  { label: "CTA Button Link", name: "cta_button_link", widget: "string" },
                ]
              }
            ]
          },
          {
            name: "pages",
            label: "📄 Pages",
            folder: "src/content",
            create: true,
            slug: "{{slug}}",
            filter: { field: "layout", value: "" },
            fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Body", name: "body", widget: "markdown" },
            ]
          },
          {
            name: "blog",
            label: "📝 Blog",
            folder: "src/content/blogs",
            create: true,
            slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
            fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Description", name: "description", widget: "text" },
              { label: "Publish Date", name: "date", widget: "datetime" },
              { label: "Featured Image", name: "image", widget: "image", required: false, default: "/images/blog-1.jpg" },
              { label: "Draft", name: "draft", widget: "boolean", default: true },
              { label: "Body", name: "body", widget: "markdown" },
            ]
          },
          {
            name: "portfolio",
            label: "🎨 Portfolio",
            editor: { preview: false },
            files: [
              {
                file: "src/content/portfolio.md",
                label: "Portfolio Page",
                name: "portfolio",
                fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Projects", name: "projects", widget: "list", fields: [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Category", name: "category", widget: "select", options: ["E-Commerce", "Healthcare", "EdTech", "Branding", "SaaS", "Mobile", "Other"] },
                    { label: "Description", name: "description", widget: "text" },
                    { label: "Tags", name: "tags", widget: "list", default: [] },
                    { label: "Image", name: "image", widget: "image", required: false },
                  ]},
                ]
              }
            ]
          },
          {
            name: "about",
            label: "👥 About Page",
            editor: { preview: false },
            files: [
              {
                file: "src/content/about.md",
                label: "About Content",
                name: "about",
                fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Mission", name: "mission", widget: "string" },
                  { label: "Story", name: "story", widget: "text" },
                  { label: "Stats", name: "stats", widget: "list", fields: [
                    { label: "Number", name: "number", widget: "string" },
                    { label: "Label", name: "label", widget: "string" },
                  ]},
                  { label: "Values", name: "values", widget: "list", fields: [
                    { label: "Name", name: "name", widget: "string" },
                    { label: "Description", name: "description", widget: "text" },
                    { label: "Icon", name: "icon", widget: "image", required: false },
                  ]},
                  { label: "Testimonials", name: "testimonials", widget: "list", fields: [
                    { label: "Quote", name: "quote", widget: "text" },
                    { label: "Author", name: "author", widget: "string" },
                    { label: "Role", name: "role", widget: "string" },
                  ]},
                ]
              }
            ]
          },
          {
            name: "services",
            label: "🛠️ Services Page",
            editor: { preview: false },
            files: [
              {
                file: "src/content/services.md",
                label: "Services Content",
                name: "services",
                fields: [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Services", name: "services", widget: "list", fields: [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Icon", name: "icon", widget: "image", required: false },
                    { label: "Description", name: "description", widget: "text" },
                    { label: "Details", name: "details", widget: "list", default: [] },
                  ]},
                ]
              }
            ]
          },
        ]
      }
    });
  </script>
</body>
</html>
